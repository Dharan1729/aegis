name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUFF_VERSION: "0.16.3"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==$RUFF_VERSION"
      - run: ruff check . && ruff format --check .
      - run: |
          for pkg in aegis-server aegis-sdk aegis-cli; do
            (cd "$pkg" && ruff check . && ruff format --check .)
          done

  cedar-sidecar:
    name: cedar-sidecar (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cedar-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cedar-sidecar
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-audit --locked && cargo audit

  sdk:
    name: aegis-sdk (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [core, langgraph, crewai, semantic-kernel, openai-agents, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          if [ "${{ matrix.extra }}" = core ]; then extras=test; else extras="${{ matrix.extra }},test"; fi
          pip install -e "aegis-sdk[$extras]" pydantic
      - working-directory: aegis-sdk
        run: python -m pytest tests -v

  server-unit:
    name: aegis-server (unit, no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "aegis-server[test]"
      - working-directory: aegis-server
        run: python -m pytest tests/unit -v

  integration:
    name: stack (integration tests, attacks, fault injection, quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "aegis-server[test]" -e aegis-sdk -e aegis-cli asyncpg
      - name: Dev keys
        run: python scripts/gen_test_keys.py
      - name: Start the stack
        run: |
          docker compose up --build -d
          for i in $(seq 1 90); do curl -sf http://localhost:8000/ready && exit 0; sleep 2; done
          docker compose logs && exit 1
      - name: Seed and smoke test
        run: python scripts/seed_tenant.py && python scripts/smoke_test.py
      - name: Integration tests
        working-directory: aegis-server
        run: python -m pytest tests/integration -v
      - name: Quickstart example
        run: python examples/quickstart.py
      - name: Attack suite
        run: AEGIS_RESULTS_DIR=out python -m benchmarks.attacks
      - name: Fault injection
        run: AEGIS_RESULTS_DIR=out python -m benchmarks.fail_closed
      - name: Audit chain verifies
        run: python scripts/verify_audit_chain.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    name: image ${{ matrix.service }} (build, SBOM, scan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [cedar-sidecar, aegis-server, approval-mock]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aegis/${{ matrix.service }}:ci ./${{ matrix.service }}
      - uses: anchore/sbom-action@v0
        with:
          image: aegis/${{ matrix.service }}:ci
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegis/${{ matrix.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Base-image CVEs with no upstream fix would fail every run whatever
          # this repository does; everything fixable must be fixed.
          ignore-unfixed: true
