[project]
name = "aegis-cli"
version = "0.2.0"
description = "aegisctl: operator CLI for Aegis (tenants, policies, audit log)"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Dharan"}]
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
aegisctl = "aegis_cli.main:app"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis_cli"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008: Typer's Option(...)/Argument(...) in a parameter default IS the
# framework's documented pattern (ruff only auto-exempts str/int/bool-typed
# defaults, not the Path-typed ones here) — same rationale as aegis-server's
# FastAPI Depends(...)/Header(...) ignore.
ignore = ["B008"]
