[project]
name = "aegis-sdk"
version = "0.2.0"
description = "Aegis SDK: authorize AI agent tool calls in LangGraph, CrewAI, Semantic Kernel, the OpenAI Agents SDK and MCP"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Dharan"}]
readme = "README.md"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Floors are the versions the adapters were tested with (Nov 2026). Older
# releases may work but are not tested; some lack the hooks the adapters use.
langgraph = [
    "langgraph>=1.2",
    "langchain-core>=1.8",
]
crewai = [
    "crewai>=1.15",
]
semantic-kernel = [
    "semantic-kernel>=1.47",
]
openai-agents = [
    "openai-agents>=0.20",
]
mcp = [
    "mcp>=1.30",
]
test = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
